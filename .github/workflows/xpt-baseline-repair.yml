# XPT – Baseline repair (diagnostic only)
# Characterises classical baseline detectors (CUSUM_LV + spectral).
# Does NOT evaluate or confirm the XPT detector.
#
# Protocol: XPT-BASELINE-REPAIR-1.1
name: XPT - Baseline repair (diagnostic)
run-name: XPT baseline repair ${{ github.run_number }} (attempt ${{ github.run_attempt }})
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-repair:
    name: Calibrate and verify baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Download repository at this run's commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Refuse dirty working tree
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is not clean. Refusing to run diagnostic procedure."
            git status
            exit 1
          fi
      - name: Prepare output and temporary directories
        shell: bash
        run: |
          mkdir -p results "$RUNNER_TEMP/xpt-private-tmp"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/xpt-private-tmp" >> "$GITHUB_ENV"
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install numerical dependency and record environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.3.5
          {
            echo "=== Python ==="
            python --version
            echo "=== Packages ==="
            python -m pip freeze
            echo "=== Git ==="
            git rev-parse HEAD
            echo "=== Platform ==="
            uname -a
          } > results/environment.txt
      - name: Test calibration stop rules and evaluator
        shell: bash
        run: |
          set -euo pipefail
          python sim/GATE_1/run_baseline_repair.py --self-test 2>&1 | tee results/self_test.log
      - name: Run diagnostic calibration and verification
        shell: bash
        run: |
          set -euo pipefail
          python sim/GATE_1/run_baseline_repair.py --out results/baseline-repair 2>&1 | tee results/console.log
      - name: Show result on the run page
        if: always()
        shell: bash
        run: |
          if [ -f results/baseline-repair/SUMMARY.md ]; then
            echo "## Baseline repair summary" >> "$GITHUB_STEP_SUMMARY"
            cat results/baseline-repair/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
            if [ -f results/baseline-repair/frozen_configs.json ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "### Frozen configs SHA256" >> "$GITHUB_STEP_SUMMARY"
              sha256sum results/baseline-repair/frozen_configs.json >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No benchmark summary: inspect the first failed step and available logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save reports and logs as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xpt-baseline-repair-1.1-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
